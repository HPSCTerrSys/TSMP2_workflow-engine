######
## Master config file for general settings
######

# main settings
MODEL_ID=ICON #ParFlow #ICON-eCLM #ICON-eCLM-ParFlow #ICON
EXP_ID="pkp006" #"eur-12-iic" #"eur-11u"
CASE_ID="" # identifier for cases
conf_file="" # configure file for cases, also possible ${EXP_ID}.conf

# job scheduler: slurm (default), pbs, or local
scheduler=slurm # 'local' runs jobs synchronously in the foreground with no queue

# main switches (PREprocessing, SIMulations, POSt-processing, VISualisation)
lpre=( false false false ) # config, run, cleanup
lsim=( true true true ) # config, run, cleanup
lpos=( false false false ) # config, run, cleanup
lvis=( false false false ) # config, run, cleanup

# time information
cpltsp_atmsfc=900 # coupling time step, atm-sfc, eCLM timestep [sec]
cpltsp_sfcss=900 # coupling time step, sfc-ss, ParFlow timestep [sec]
simlength="1 day" # pkp006 benchmark: one simulated day at 16 then 32 nodes (performance_plan.md 15.1); later "1 month"
startdate="2001-12-01T00:00Z" # ISO norm 8601; pkp006 coldstart = spinup month 2001-12
inidate=${startdate} # ISO norm 8601, fix for entire simulation
numsimstep=1 # number of simulation steps, simulation period = numsimstep * simlength

# mail notification for scheduler jobs
mailtype=NONE # NONE, BEGIN, END, FAIL, REQUEUE, ALL (mapped to PBS -m code if scheduler=pbs)
mailaddress=""

# user setting, leave empty for jsc machine defaults
prevjobid="" # previous job-id, default leave empty
npnode="" # number of cores per node
partition="" # compute partition (slurm) / queue (pbs)
account="" # SET compute account. $BUDGET_ACCOUNTS / slts is used, if not set.

# wallclock
pre_wallclock=00:35:00
sim_wallclock=02:30:00 # needs to be format hh:mm:ss; pkp006 benchmark: one simulated day at 16 nodes is expected at about 1 h plus init and I/O, so this ends cleanly and ICON writes its timer report
pos_wallclock=00:05:00
vis_wallclock=00:05:00

# file/directory pathes
tsmp2_dir=$TSMP2_DIR
tsmp2_install_dir="${ctl_dir}/../src/TSMP2/bin/JURECA_ICON_r2026p04p_stage2026GnuOpenMPI" # ICON 2026.04, GNU + OpenMPI; "" = default
tsmp2_env="" # leave empty to use default

# number of nodes per component (<comp>_node will be set to zero, if not indicated in MODEL_ID)
ico_node=16 # pkp006 benchmark, first of two: 16 nodes now, then 32 with everything else unchanged, to measure the scaling instead of extrapolating it (performance_plan.md 15.1)
clm_node=1
pfl_node=2

# DebugMode: No job submission. Just config
debugmode=false # pkp006: ten-stream namelist dry run checked 2026-09-13 (sodird_s removed); this is the 16-node benchmark

# log job status
joblog=true
