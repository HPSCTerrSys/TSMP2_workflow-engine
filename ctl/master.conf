######
## Master config file for general settings
######

# main settings
MODEL_ID=ICON #ParFlow #ICON-eCLM #ICON-eCLM-ParFlow #ICON
EXP_ID="pkp007" #"eur-12-iic" #"eur-11u"; pkp007 (JUPITER GPU, 2026-10-10), was pkp006
CASE_ID="p007" # 2002-05 .. 06 (2026-10-16): chain of two months, 25 s, ndyn_substeps 6, no intermediate checkpoints (expid.conf icon_checkpoint_intval P01M). Before: 2002-04 (2026-10-16, job 2352786 OK): 25 s, ndyn_substeps 6, from the 2002-03-26 rerun's month-end restart. Before: 2002-03-26 rerun (2026-10-16): the last 6 days of March from the 03-26 checkpoint of the failed job 2326465, 25 s, ndyn_substeps 6 (expid.conf); output to dta/simres/p007_icon_20020326. pkp007 P-c production; back after the x0201r6/x0201c3r6 tests (2026-10-14): 25 s stays (stability, option B), all other settings as p007 (physics 2/4/4 x dtime, P05D checkpoints, 8 nodes). pkp007 P-c production. From 2002-02 on all months at 25 s (option B, the user, 2026-10-13; expid.conf icon_spinup_end 2003-01-01): 2002-02 at 30 s failed (2304874, 2002-02-02 ~10:36). Before: 2002-02 at 30 s again (the user, 2026-10-13, before the dry run; expid.conf icon_spinup_end 2002-02-01). 2002-01 done at 25 s (job 2297593). 2002-01 rerun (2026-10-12) at 25 s (expid.conf icon_spinup_end 2002-02-01, option D) after the 30 s blow-up at 2002-01-06 ~23:15 near Jan Mayen (2292657, 2293472); x0105 diagnostics done: x0105ng (graphs cleared), x0105sy (no GPU fault, CFL from the model top), x0105dt (25 s passes). P-c (2026-10-11): pkp007 production 2001-12 .. 2002-12, 8 nodes, configuration frozen after P-b (graphs on, GPU memory print off); started with 2001-12 alone. P-b done: b08g, b16g, b08gm (jupiter_benchmarks.md). P-a done: s06a..s32 (jupiter_benchmarks.md). Identifier for cases. pkp007 RULE (2026-10-10, D5): never empty, production included -- "" is pkp006's (dta/simres/icon_<date>, dta/postpro/icon). One case per test (j1, s06a, s12, ...) and one for the production run (name to decide). The engine appends "_": run/sim_<case>_icon_<date>, dta/simres/<case>_icon_<date>, dta/postpro/<case>_icon (expid.conf pos_out); a rerun of the same case moves the old results to *_bku<time>
conf_file="" # configure file for cases, also possible ${EXP_ID}.conf

# job scheduler: slurm (default), pbs, or local
scheduler=slurm # 'local' runs jobs synchronously in the foreground with no queue

# main switches (PREprocessing, SIMulations, POSt-processing, VISualisation)
lpre=( false false false ) # config, run, cleanup
lsim=( true true true ) # config, run, cleanup; pkp006 production: cleanup moves output, restart, namelists and logs into dta/simres/icon_<YYYYMMDD>. OFF 2026-09-29: the simulation is finished (2001-12..2002-12); this submission is post-processing only. pkp007 J1/J2 (2026-10-10): ON
lpos=( false false false ) # config, run, cleanup; pkp006: post-processing runs as its own job, after the chunks (2002_04 was job 15638051). ON 2026-09-29 for the backlog 2002_05..2002_12, see numsimstep. pkp007: OFF until J5 -- pos_out (dta/postpro/icon/<YYYY_MM>) has no case in it and would overwrite pkp006's post files
lvis=( false false false ) # config, run, cleanup

# time information
cpltsp_atmsfc=900 # coupling time step, atm-sfc, eCLM timestep [sec]
cpltsp_sfcss=900 # coupling time step, sfc-ss, ParFlow timestep [sec]
simlength="1 month" # p007 2002-04 (2026-10-16). Before: "6 days", 2002-03-26 rerun: to 2002-04-01, where the month-end restart is written (restartTimeIntval P01M from 2001-12-01; lrestart_write_last). RESTORE "1 month" for 2002-04. pkp007 P-c: one month per chunk = restartTimeIntval P01M, so each chunk ends with its restart (as pkp006, O49). P-a/P-b: "2 days". pkp006 production: one chunk = one month = restartTimeIntval, so the restart event lands exactly on the chunk end (O49). The driver advances startdate by this much per chunk. pkp007 J1/J2: 6 model hours (jupiter_plan.md, J2); pkp006: "1 month"
startdate="2002-12-01T00:00Z" # p007 2002-12 rerun (2026-10-19, option D: nlev_hcfl 15, cfl_monitoring_freq 1, P05D), from p007's own 2002-11 restart (chain line: dta/simres/p007_icon_20021101/rst, …20021201…, ndyn_substeps_DOM01 = 6); the first try 2382654 failed on 2002-12-23 18:25. Before: 2002-07-01 (2002-07 .. 12 chain, 2026-10-17). Before: p007 2002-05 .. 06 (2026-10-16), May from p007's own 2002-04 restart (chain line: dta/simres/p007_icon_20020401/rst, pkp007_restart_ATMO_20020501T000000Z.nc, ndyn_substeps_DOM01 = 6). Before: 2002-04 (2026-10-16), restart from dta/simres/p007_icon_20020326/rst (expid.conf override). Before: 2002-03-26 rerun: 2002-03-26 rerun (2026-10-16) from the 03-26 checkpoint (expid.conf simrstm1_dir override); lrestart = true. Before: 2002-03-01. pkp007 P-c 2002-03 at 25 s (2026-10-14), from p007's own 2002-02 restart (chain line: dta/simres/p007_icon_20020201/rst). x0201r6/x0201c3r6 tests: 2002-02. pkp007 P-c 2002-02 rerun at 25 s (2026-10-13, after the 30 s failure 2304874); before: 2002-02 at 30 s (2026-10-13), from p007's own 2002-01 restart (chain line: dta/simres/p007_icon_20020101/rst, pkp007_restart_ATMO_20020201T000000Z.nc). 2002-01 rerun at 25 s (2026-10-12), from p007's own 2001-12 restart (chain line). x0105 diagnostics started from 2002-01-05. pkp007 P-c: 2002-01, restart from p007's own 2001-12 chunk (dta/simres/p007_icon_20011201/rst, expid.conf chain line); != inidate, so lrestart=true and 30 s. 2001-12 coldstart done: job 2284978 (2026-10-11/12). P-a/P-b: 2002-12-01 from pkp006's restart. ISO norm 8601; pkp006 2026-09-29: first month of the post-processing backlog 2002_05..2002_12 (the last simulated chunk, 2002-12, needed latbc_zip/200301/LOWBC_2003_01.nc from aux/make_lowbc_next_month.py). pkp007 J1/J2: the coldstart, = inidate
inidate="2001-12-01T00:00Z" # ISO norm 8601, fix for entire simulation; pkp006: kept fixed at the coldstart (was ${startdate}, identical for the coldstart chunk, wrong for every later one: lrestart needs startdate > inidate, F38)
numsimstep=1 # p007 2002-12 rerun alone (2026-10-19). Before: 6 = 2002-07 .. 12 (2026-10-17). Before: 2 = p007 2002-05 .. 06 (the user, 2026-10-16): two monthly chunks, June restarting from May (chain line), submitted at once with afterok dependencies; no post-processing (lpos off). Before: 1, 2002-03-26 rerun and 2002-04 alone (2026-10-16). Before: 3 = pkp007 P-c 2002-03 .. 2002-05 (the user, 2026-10-14): three monthly chunks, each restarting from the previous one (chain line), submitted at once with afterok dependencies; no post-processing (lpos off). Before: pkp007 P-c: 2002-01 alone (the user), the first read of a GPU-written restart; then chain 2002-02..12. 2001-12 alone was the first GPU restart write (OK, < 1 min). P-a: one 2-day chunk per case (pkp006: 8). Number of simulation steps, simulation period = numsimstep * simlength. pkp006 2026-09-29: 8 = one post job per month, 2002_05..2002_12. NOTE, POST-ONLY: unlike sim chunks (afterok on the previous sim_id), post jobs are NOT chained -- the post section depends only on prevjobid, which the loop never updates -- so all 8 are submitted at once, 1 node each, and run in parallel. That is safe: each derives its own pos_tmp (tmp_<YYYYMMDD>) and output dir (postpro/icon/<YYYY_MM>), and the shared remap weights already exist, so they are only read. A failed month does not stop the others; resubmit it alone. Sim chains used 3 (2002-06..08, 2002-09..11) and 1 (2002-12)

# mail notification for scheduler jobs
mailtype=ALL # NONE, BEGIN, END, FAIL, REQUEUE, ALL (mapped to PBS -m code if scheduler=pbs); pkp006: mail on every job state change (user, 2026-09-13)
mailaddress="k.goergen@fz-juelich.de"

# user setting, leave empty for jsc machine defaults
prevjobid="" # previous job-id, default leave empty
npnode=5 # number of cores per node; pkp007 (JUPITER GPU): MPI ranks per node = 4 GPU ranks + 1 CPU rank (I/O or prefetch), so ico_proc = 5 x ico_node (was "", i.e. the JUPITER default 288 cores)
partition="" # compute partition (slurm) / queue (pbs)
account="clmcomksicon" # SET compute account. $BUDGET_ACCOUNTS / slts is used, if not set. pkp007 (JUPITER, 2026-10-09): clmcomksicon, which on JUPITER is both the compute project and the Slurm budget account (jutil user projects). pkp006 history: set explicitly so a shell without "jutil env activate -p cjjsc39" cannot fall back to slts. Note the two names: cjjsc39 is the compute PROJECT (what jutil takes), jjsc39 the Slurm ACCOUNT (what sbatch takes) -- all 23 pkp006 jobs to date ran under jjsc39.

# wallclock
pre_wallclock=00:35:00
sim_wallclock=07:00:00 # needs to be format hh:mm:ss; p007 2002-12 rerun (31 d): 107,136 steps x ~0.185 s (2002-10/11 at 6 substeps, + P05D checkpoints) = ~5.5 h + ~6 min, plus a few min for extra substeps while the CFL control is active; 7 h = +25 %. p007 2002-05 .. 06 (31/30 d), per chunk: 107,136 steps x 0.1893 s (2002-04, ndyn 6, incl. its 5-day checkpoints) = 5.63 h + ~6 min = ~5.75 h for May, slightly less without intermediate checkpoints; 7 h = +22 %. 2002-04 took 5:32:36. p007 2002-04 (30 d): 103,680 steps x 0.1776 s x 1.056 (ndyn 6) = 5.40 h + ~6 min = ~5.5 h; 7 h = +27 %. Before: 02:00:00 for the 6-day rerun; 2002-03-26 rerun: 6 d = 20,736 steps x 0.1776 s x ~1.05 (ndyn 6) = ~1.1 h + ~6 min; 2 h. Before: 07:00:00 per chunk, for 2002-03/04/05 (31/30/31 d; 30 d ~5.2 h); p007 2002-03 at 25 s (31 d): 107,136 steps x 0.1776 s (2002-02) = 5.29 h + ~6 min (incl. 5-day checkpoints) = ~5.4 h; 7 h = +30 %, as 2002-01 (5:20:55). x0201r6 (dt_rad 6 x, no intermediate checkpoints): radiation + preradiation are 30 % of the loop, a third fewer calls -> ~-10 % -> ~0.16 s/step x 96,768 = ~4.3 h + ~5 min; 6:30 kept (worst case as p007 2002-02, 4:51). p007 2002-02 rerun at 25 s: 96,768 steps x 0.177 s = 4.76 h + overhead ~5 min = ~4.85 h; 6:30 = +34 %. 31-day months at 25 s: 107,136 steps = ~5.3 h -> 7:00 (as 2002-01, 5:20:55). p007 2002-02 at 30 s (5:30): 80,640 steps x 0.177 s (2002-01 incl. 5-day checkpoints) = 3.96 h + overhead ~5 min = ~4.05 h; 5:30 = +36 % (the user, 2026-10-13). Briefly 6:30 for 25 s. 2002-01 (7 h) took 5:20:55. p007 2002-01 rerun at 25 s: 107,136 steps x 0.175 s (x0105dt) = 5.2 h + restart read/init/write/engine ~6 min = ~5.3 h; 7 h = +32 %, as 2001-12 (25 s, 5:12:35). x0105dt (1 h): 2 days at 25 s = 6,912 steps x 0.1725 s (2001-12 at 25 s, graphs on) = ~20 min + restart read ~2.5 min + init ~2 min + restart write < 1 min + engine = ~27 min; 1 h. x0105sy: synchronous OpenACC, slowdown unknown (ICON launches many small kernels; assumed up to ~5x): x0105ng reached the failure (5,668 steps) in ~19 min loop, x5 = ~95 min + init/restart read ~5 min; 3 h so a slow run still reaches 2002-01-06 23:15. x0105ng: 5,760 steps x ~0.19 s = ~18 min + restart read ~2.5 min + init + engine = ~25 min; 1 h. P-c 2002-01: 06:00:00 -- RESTORE afterwards. pkp007 P-c 2002-01 (30 s): 89,280 steps x 0.1725-0.1766 s = 4.3-4.4 h + restart read ~1.5 min + init ~2 min + restart write < 1 min + engine ~2 min = ~4.5 h; 6 h = +33 %. 2001-12 (25 s, 7 h limit) took 5:12:35 (0.1725 s/step). P-a: 1 h; J2: 1 h for 6 model hours (JUPITER max 12 h; was 16:00:00). pkp006 2002-05: 31 days, as January 13:38:23 and March 13:45:01 -- ~13h45m expected, 16 h is ~16 % margin, the proportion that has held for four chunks
pos_wallclock=02:00:00 # pkp006: ~41 min for a month with the weights in place and nothing else running (F46), but ~1h35 when a 32-node chunk shares the file system -- job 15632509 hit the old 1h15 limit two minutes from finishing T_2M, with SP300p still to come (F51). 2 h covers both cases; an over-long request costs queue position, a short one costs the whole run
vis_wallclock=00:05:00

# file/directory pathes
tsmp2_dir=$TSMP2_DIR
tsmp2_install_dir="${ctl_dir}/../src/TSMP2/bin/JUPITER_ICONGPU_r2026p04p_stage2026NVHPC" # pkp007: ICON 2026.04, OpenACC GPU build, NVHPC + OpenMPI (J0, 2026-10-09); pkp006 was JURECA_ICON_r2026p04p_stage2026GnuOpenMPI. "" = default
tsmp2_env="" # leave empty to use default

# number of nodes per component (<comp>_node will be set to zero, if not indicated in MODEL_ID)
ico_gpus_per_node=4 # pkp007 (JUPITER GPU, 2026-10-10): GPU (compute) ranks per node, the other npnode - ico_gpus_per_node ranks per node are CPU ranks (I/O, restart, prefetch); switches on the hostfile placement and per-rank GPU binding in sim_config.sh. Leave empty for CPU runs (pkp006 behaviour)
ico_node=8 # pkp007 P-b and P-c: 8 nodes = 32 GPU + 8 CPU ranks (7 I/O + 1 prefetch, derived in expid.conf); the production count (the user, 2026-10-11). b16g ran at 16. P-a: 6..32 per case. J1/J2: 6 nodes = 24 GPU + 6 CPU ranks (the proposal's smallest layout; the user, 2026-10-10). pkp006: 2001-12 month on 32 nodes (F41); 2002-01 also 32 (~14 h; 24 nodes ~18 h for the same core-h) to confirm the 25 -> 30 s restart quickly; benchmarks 16/24/32 (F33-F37)
clm_node=1
pfl_node=2

# DebugMode: No job submission. Just config
debugmode=false # p007 2002-12 rerun (option D): dry run checked 2026-10-19, now off: the next control_tsmp2.sh call submits the month. p007 2002-07 .. 12: dry run checked 2026-10-17, now off: the next control_tsmp2.sh call submits the six chunks (each afterok on the previous). p007 2002-05 .. 06: dry run checked 2026-10-16, now off: the next control_tsmp2.sh call submits the two chunks (June afterok on May). p007 2002-04: dry run checked 2026-10-16, now off: the next control_tsmp2.sh call submits the month. 2002-03-26 rerun: dry run checked, checkpoint attribute ndyn_substeps_DOM01 set to 6 by the user (2026-10-16), now off: the next control_tsmp2.sh call submits the rerun. p007 2002-03 .. 05: dry run of 2002-03 checked 2026-10-14, now off: the next control_tsmp2.sh call submits the three chunks. x0201c3r6: dry run checked 2026-10-14, now off: the next control_tsmp2.sh call submits the test. x0201r6: dry run checked 2026-10-14, now off: the next control_tsmp2.sh call submits the test. p007 2002-02 rerun at 25 s: dry run checked 2026-10-13, now off: the next control_tsmp2.sh call submits the month. p007 2002-02 (30 s): dry run checked 2026-10-13, now off: the next control_tsmp2.sh call submits the month. p007 2002-01 rerun: dry run checked 2026-10-12, now off: the next control_tsmp2.sh call submits the month at 25 s. x0105dt: dry run checked 2026-10-12, now off: the next control_tsmp2.sh call submits the 25 s test. x0105sy: dry run checked 2026-10-12, now off: the next control_tsmp2.sh call submits the diagnostic run. x0105ng: dry run checked 2026-10-12, now off: the next control_tsmp2.sh call submits the diagnostic run. P-c 2002-01: dry run checked 2026-10-12.

# log job status
joblog=true
