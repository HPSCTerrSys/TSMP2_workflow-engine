######
## Master config file for general settings
######

# main settings
MODEL_ID=ICON #ParFlow #ICON-eCLM #ICON-eCLM-ParFlow #ICON
EXP_ID="pkp006" #"eur-12-iic" #"eur-11u"
CASE_ID="" # identifier for cases
conf_file="" # configure file for cases, also possible ${EXP_ID}.conf

# job scheduler: slurm (default), pbs, or local
scheduler=slurm # 'local' runs jobs synchronously in the foreground with no queue

# main switches (PREprocessing, SIMulations, POSt-processing, VISualisation)
lpre=( false false false ) # config, run, cleanup
lsim=( true true true ) # config, run, cleanup
lpos=( false false false ) # config, run, cleanup; pkp006: post-processing tested 2026-09-13 (job 15617924) and across the restart 2026-09-14 (job 15618861, F38), switch on for monthly chunks
lvis=( false false false ) # config, run, cleanup

# time information
cpltsp_atmsfc=900 # coupling time step, atm-sfc, eCLM timestep [sec]
cpltsp_sfcss=900 # coupling time step, sfc-ss, ParFlow timestep [sec]
simlength="1 month" # pkp006: the full 2001-12 spinup month at 25 s as one chunk (was "1 day" for the benchmarks F33-F37 and the restart test F38)
startdate="2002-01-01T00:00Z" # ISO norm 8601; pkp006: 2002-01, first 30-s chunk, restart from the 2001-12 month (F41); the coldstart was 2001-12-01
inidate="2001-12-01T00:00Z" # ISO norm 8601, fix for entire simulation; pkp006: kept fixed at the coldstart (was ${startdate}, identical for the coldstart chunk, wrong for every later one: lrestart needs startdate > inidate, F38)
numsimstep=1 # number of simulation steps, simulation period = numsimstep * simlength

# mail notification for scheduler jobs
mailtype=ALL # NONE, BEGIN, END, FAIL, REQUEUE, ALL (mapped to PBS -m code if scheduler=pbs); pkp006: mail on every job state change (user, 2026-09-13)
mailaddress="k.goergen@fz-juelich.de"

# user setting, leave empty for jsc machine defaults
prevjobid="" # previous job-id, default leave empty
npnode="" # number of cores per node
partition="" # compute partition (slurm) / queue (pbs)
account="" # SET compute account. $BUDGET_ACCOUNTS / slts is used, if not set.

# wallclock
pre_wallclock=00:35:00
sim_wallclock=16:00:00 # needs to be format hh:mm:ss; pkp006 2002-01 on 32 nodes at 30 s: 89 280 steps x 0.539 s (F41) = 13.4 h + ~10 min restart read/final restart; no 5-day checkpoints; ~17 % margin (2001-12 at 25 s used 16:34 h)
pos_wallclock=01:00:00 # pkp006: one test day incl. the one-off weights took 2 min (job 15617924); a month of the four post files is untimed, so 1 h stays until measured
vis_wallclock=00:05:00

# file/directory pathes
tsmp2_dir=$TSMP2_DIR
tsmp2_install_dir="${ctl_dir}/../src/TSMP2/bin/JURECA_ICON_r2026p04p_stage2026GnuOpenMPI" # ICON 2026.04, GNU + OpenMPI; "" = default
tsmp2_env="" # leave empty to use default

# number of nodes per component (<comp>_node will be set to zero, if not indicated in MODEL_ID)
ico_node=32 # pkp006: 2001-12 month on 32 nodes (F41); 2002-01 also 32 (~14 h; 24 nodes ~18 h for the same core-h) to confirm the 25 -> 30 s restart quickly; benchmarks 16/24/32 (F33-F37)
clm_node=1
pfl_node=2

# DebugMode: No job submission. Just config
debugmode=false # pkp006: ten-stream namelist dry run checked 2026-09-13 (sodird_s removed); benchmark runs submit directly

# log job status
joblog=true
