[sim_config_clm]
domainfile_clm=domain_${domain_size_str}x${domain_size_str}_e2000.nc
surffile_clm=surfdata_${domain_size_str}x${domain_size_str}_e2000_${CASE_ID:0:11}.nc
topofile_clm=topodata_0.9x1.25_zeroed.nc
