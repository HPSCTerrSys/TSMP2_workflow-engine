[sim_config_general]
lreal=false
domain_size_str=${CASE_ID:17:4}
domain_size=$(echo "$domain_size_str" | sed 's/^0*//') #$((10#$domain_size_str))

[sim_config_icon]
icon_numioprocs=1
domainfile_icon=static/torus_grid_x${domain_size_str}_y${domain_size_str}_e2000m.nc
