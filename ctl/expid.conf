[sim_config_general]
# pkp006 (2026-09-16): the previous chunk's restart is taken straight from its simulation directory,
# so the link directory dta/restart/<chunk>/icon is no longer needed (T6 keeps the restart in simout;
# performance_plan.md 18.1). sim_config.sh appends "/icon" to this path. Evaluated per chunk, because
# parse_config_file evals the value after ${datem1} is set by control_tsmp2.sh.
#simrstm1_dir=${out_dir}/${caseid}${modelid}_$(date -u -d "${datem1}" +%Y%m%d)/rst # the chain line (pkp006; restored for pkp007 P-c, 2026-10-11): each chunk restarts from the previous chunk of the same case, e.g. dta/simres/p007_icon_20011201/rst for 2002-01. P-a/P-b used pkp006's 2002-12-01 restart here instead. Restored again after the x0105 diagnostics (2026-10-12), which started from the 2002-01-05 checkpoint of the failed 2293472 Restored again after the x0201r6/x0201c3r6 tests (2026-10-14). Commented for the 2002-03-26 rerun and 2002-04 (2026-10-16; override to dta/simres/p007_icon_20020326/rst, the rerun's month-end restart); RESTORED for 2002-05/06 (2026-10-16): May from p007_icon_20020401/rst, June from p007_icon_20020501/rst. COMMENTED for the 2002-12-21 sync test x1221sy and the p007 2002-12-21 rerun with ndyn_substeps 8 (2026-10-20), RESTORE afterwards
simrstm1_dir=${out_dir}/p007_icon_20021201_failed_2411784/rst # p007 2002-12-21 .. 2003-01-01 with ndyn_substeps 8 (the user, 2026-10-20): from the same checkpoint, its ndyn_substeps_DOM01 set to 8 by the user (tmp/set_ndyn8_1221.sh; backups with 6: the .bak and run/sim_p007_icon_20021201/). Before: 2002-12-21 sync test x1221sy (2026-10-20): from the 12-21 checkpoint of the failed option-D run (job 2411784; copied by the user; 91,041,695,656 bytes, ndyn_substeps_DOM01 = 6); the .nc.bak backup is not matched by the lookup (*.nc). REMOVE afterwards

[sim_config_icon]
# pkp006, PG KICS cycle-2026 initial tests: EUR-3 / R13B07 (~3 km), ICON 2026.04, ERA5-driven.
# Inputs are linked from the PG KICS repo into dta/ by aux/link_pgkics_to_wfe.sh (pkp006 root repo).
nproma=0 # pkp007 (GPU): off, nblocks_c sets it; must be 0 with nblocks_c > 0 (ICON finish). Engine default 12 = pkp006
nblocks_c=1 # pkp007 (GPU): one cell block per GPU rank, as ICON's santis_gpu target and MeteoSwiss ICON-CH1 on GH200 (the user, 2026-10-10)
nproma_sub=20000 # pkp007 J1: ETH's R13B07 value; ~132 k cells per GPU on 6 nodes -> ~7 physics sub-blocks, keeps GPU memory down. Tentative, tested in J3
ecrad_isolver=2 # pkp007 (GPU): McICA-ACC, the OpenACC port of McICA; 0 (McICA, pkp006) aborts in ecrad_openacc_crosscheck (J1 job 2262645). As ETH on R13B07. Same method, own OpenACC copy of the cloud generator (cloud_generator_acc): not bit-identical to CPU McICA
lcuda_graph_turb_tran=.true. # pkp007 P-b b08g (2026-10-11): CUDA graph for the turbulent transfer, as MeteoSwiss ICON-CH1/CH2 on GH200. Engine default .false. (pkp006, J1, P-a). Implementation only. KEPT for P-b and P-c (the user, 2026-10-11): b08g -7.7 % loop at 8 nodes; differences to s08 are within the GPU run-to-run noise. Cleared as a cause of the 2002-01-06 blow-up by x0105ng (2026-10-12). Off only for the sync test x1221sy (2026-10-20; graph capture cannot run with acc_synchronous, 2422233), restored
disable_print_gpu_mem=.true. # pkp007 P-b b08gm (2026-10-11): no per-step GPU memory print (~2 % of the loop at 8 nodes: gpu_mem_use 18.7 s in b08g). Step-rate stamps ("Time step:", every 25 steps) unaffected; GPU memory known from b08g (81.6 GB). Kept for P-c if it pays off (the user: minimal logging in production)
lcuda_graph_lnd=.true.      # pkp007 P-b b08g: CUDA graph for TERRA, sea ice, FLake (the worst-scaling part in P-a: surface 0.84 at 8 nodes, 0.25 at 32). Same rule
icon_ndyn_substeps=7 # pkp007 from 2002-12-21 (the user, 2026-10-20): 7 dynamics substeps. 8 blew up deterministically on 12-21 ~03:38 over Finnmark (2425992, 2426353: |w| grew exponentially at L11-13 from ~02:45, 2-step alternation from 03:28), 6 on 12-23 ~17:00 over Jordan / northern Saudi Arabia (3 runs). Guideline 1.8 x 7 x dx = 38.2 s (25 s = 65 %). Cost ~+5 % vs 6. Checkpoint attribute set to 7 by the user (tmp/set_ndyn7_1221.sh). Before: 8, pkp007 from 2002-12-21 (the user, 2026-10-20): 8 dynamics substeps after three blow-ups on 2002-12-23 at 6 (2382654 18:25, 2411784 16:52, x1221sy 2422443 ~17:25; at the model top near 38.5-39.6E 30N; ICON's CFL control does not catch it, x1221sy). ICON's guideline dtime_max ~ 1.8 x ndyn_substeps x dx = 43.6 s with 8 (25 s = 57 %). Cost ~+2 x 0.009-0.012 s per step (~+10-13 %). The 12-21 checkpoint's ndyn_substeps_DOM01 is set to 8 by the user (tmp/set_ndyn8_1221.sh; ICON takes the value from the restart). Before: 6, pkp007, KEPT for the rest of pkp007 (the user, 2026-10-16): 6 dynamics substeps instead of ICON's default 5 (sim_config.sh adds it to &nonhydrostatic_nml). ICON's guideline dtime_max ~ 1.8 x ndyn_substeps x dx = 27.3 s with 5 at R13B07 (25 s = 92 %), 32.7 s with 6 (76 %). Since the 2002-03-26 rerun (job 2351298, passed the 25 s failure of job 2326465); ~+5 % cost. Restarts carry ndyn_substeps_DOM01 = 6 from then on; keep this consistent with them (Q14)
icon_nlev_hcfl=15 # pkp007 from 2002-12 (the user, 2026-10-19, option D): ICON's horizontal-CFL control of the adaptive substepping over the top 15 of 65 levels (ICON default 0 = off; docs: "the upper 10-15 levels"). Why: the blow-ups (2002-01/02/03/12) start as horizontal CFL near the top, which ICON does not watch with nlev_hcfl = 0; it watched only the vertical CFL, every 5 steps, and reacted after the explosion (x0105sy). Raises ndyn_substeps only while needed (up to 6+7). Q14
icon_msg_level=7 # pkp007 from the 2002-12-21 rerun (the user, 2026-10-20): ICON prints once per step the global max |vn| and |w| with their levels and a "Time step:" stamp every step, to trace where/when a blow-up starts (the GPU crash often comes before ICON's location messages). ~10 MB log per 11 days, one global max per step (< 1 %). Unset = 0 (template, production)
icon_cfl_monitoring_freq=1 # pkp007 from 2002-12 (the user, 2026-10-19, option D): check the CFL every step instead of every 5 (ICON default), since the growth is explosive (<= 5 steps). Cost: one global max per step
#icon_checkpoint_intval=P01M # pkp007 P-c from 2002-05 (the user, 2026-10-16): no intermediate checkpoints (= restartTimeIntval, as pkp006 and the x0201* tests); only the month-end restart is written. Unset = the common namelist's P05D (p007 2001-12 .. 2002-04: 6 x 91 GB per month as crash insurance). COMMENTED 2026-10-19 for the 2002-12 rerun: P05D back (checkpoints 12-06, 11, 16, 21, 26, 31), after 2382654 lost 23 days without a checkpoint
icon_numioprocs=$(( ico_node*(npnode-ico_gpus_per_node) - 1 )) # pkp007 (GPU layout only): all CPU ranks (one per node) are I/O except 1 prefetch, 0 restart procs; follows ico_node, so one expid.conf fits every node count (P-a, evaluated in the job). 5 at 6 nodes, 31 at 32. Was 5; pkp006 (CPU): 3
# pkp006: the forcing is read from the compressed copy, dta/forcing/icon/latbc_zip/<YYYYMM>
# (netCDF-4 deflate 1, ~6.6x, written by aux/compress_forcing.sh with nccopy from /p/data1; F45, F49).
# Since 2026-09-16 this is the only staged copy -- forcing_eval_era5/conv2icon was cleared and the
# linker's MONTHS is empty. Proven in job 15629863: init_latbc 39.6 -> 79.3 s, no per-step cost, no
# serial fallback (F48). Same expression as the engine default (sim_config.sh:84), latbc -> latbc_zip,
# so every chunk picks its own month. The SST/sea-ice files follow via __latbc_root__ = dirname.
icon_latbc_dir=${frc_dir}/icon/latbc_zip/$(date -u -d "${startdate}" +%Y%m)
fname_iconnml=NAMELIST_icon_pkp006
icon_nml_dir=${nml_dir}/icon_pkp006 # namelists and dictionaries: symlinks into configuration_pg-kics_common/tested (linker script); the nml/icon submodule stays untouched
icon_initmode=2 # MODE_IFSANA: ERA5 (IFS) input
fname_ifs2icon=ifs2icon_R13B07_DOM01.nc
fname_iconini=${frc_dir}/icon/inidata/cas$(date -u -d "${startdate}" +%Y%m%d%H)_ini.nc
fname_icondomain=EUR-3_R13B07_v20260423-00_DOM01.nc
domainfile_icon=EUR-3_R13B07_v20260423-00_DOM01.nc
fname_iconradgrid=EUR-3_R13B07_v20260423-00_DOM01.parent.nc
fname_iconlatbcgrid=EUR-3_R13B07_v20260606-00_DOM01_latbc.grid.nc
fname_iconextpar=EUR-3_R13B07_v20260423-00_DOM01_external_parameter.HWSD2-SOILTYP_9_5.nc
fname_iconghgforc=bc_data/greenhouse_ssp245.nc # SSP2-4.5 as CEI195c, DWD and SPICE; identical to SSP3-7.0 before 2014
fname_iconsplumes=aerosoldata/MACv2.0-SP-merged-historical-and-SSP2-45_v1.nc # overrides the engine default SSP3-70
fname_iconkinne=aerosoldata/europe033_aeropt_kinne # prefix; _lw_b16_coa.nc etc. are appended
icon_kinne_bgyear=1850
fname_iconozone=bc_data/bc_ozone_historical # prefix; _<year>.nc is appended
icon_dtime=30 # [s] from 2002 on: PG KICS decision 2026-09-14 (Q2), was 36 (CEI195c); physics calls at integer multiples, dt_conv 60 s, dt_rad/sso/gwd 120 s
icon_dtime_spinup=25 # [s] spinup month 2001-12 (initialisation shock, CFL); 25 s as DWD, concept.md's 20 s was a mistake (W12)
icon_spinup_end=2003-01-01T00:00Z # pkp007 option B (the user, 2026-10-13): 25 s (icon_dtime_spinup) for the WHOLE pkp007 run, 2001-12 .. 2002-12, i.e. every chunk starts before this date; icon_dtime = 30 s is no longer used by pkp007. Why: the 30 s GPU run blew up in 2002-01 (2002-01-06 ~23:15 near Jan Mayen: 2292657, 2293472, 2294944, 2296914) and again in 2002-02 (2002-02-02 ~10:36, 2304874); numerical (CFL from the model top), not a GPU fault; 25 s passed 2002-01 (2297593) without a CFL warning. Cost +20 % (~+75 node-h for 2002-02..12). A deviation from PG KICS Q2, raised as Q13. History: 2002-02-01 (2002-01 only; 2002-02 tried at 30 s), briefly 2002-03-01; 2002-01-01T00:00Z for pkp006 and p007 2001-12

