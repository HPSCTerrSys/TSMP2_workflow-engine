###
# SIM
###
[sim_config_general]
# pkp006 (2026-09-16): the previous chunk's restart is taken straight from its simulation directory,
# so the link directory dta/restart/<chunk>/icon is no longer needed (T6 keeps the restart in simout;
# performance_plan.md 18.1). sim_config.sh appends "/icon" to this path. Evaluated per chunk, because
# parse_config_file evals the value after ${datem1} is set by control_tsmp2.sh.
simrstm1_dir=${out_dir}/${caseid}${modelid}_$(date -u -d "${datem1}" +%Y%m%d)/rst

[sim_config_icon]
# pkp006, PG KICS cycle-2026 initial tests: EUR-3 / R13B07 (~3 km), ICON 2026.04, ERA5-driven.
# Inputs are linked from the PG KICS repo into dta/ by aux/link_pgkics_to_wfe.sh (pkp006 root repo).
nproma=0 # pkp007 (GPU): off, nblocks_c sets it; must be 0 with nblocks_c > 0 (ICON finish). Engine default 12 = pkp006
nblocks_c=1 # pkp007 (GPU): one cell block per GPU rank, as ICON's santis_gpu target and MeteoSwiss ICON-CH1 on GH200 (the user, 2026-10-10)
nproma_sub=20000 # pkp007 J1: ETH's R13B07 value; ~132 k cells per GPU on 6 nodes -> ~7 physics sub-blocks, keeps GPU memory down. Tentative, tested in J3
ecrad_isolver=2 # pkp007 (GPU): McICA-ACC, the OpenACC port of McICA; 0 (McICA, pkp006) aborts in ecrad_openacc_crosscheck (J1 job 2262645). As ETH on R13B07. Same method, own OpenACC copy of the cloud generator (cloud_generator_acc): not bit-identical to CPU McICA
icon_numioprocs=5 # pkp007 (GPU): one CPU rank per node, so num_io_procs + num_restart_procs (0) + num_prefetch_proc (1) = ico_node; 5 for 6 nodes (pkp006: 3)
# pkp006: the forcing is read from the compressed copy, dta/forcing/icon/latbc_zip/<YYYYMM>
# (netCDF-4 deflate 1, ~6.6x, written by aux/compress_forcing.sh with nccopy from /p/data1; F45, F49).
# Since 2026-09-16 this is the only staged copy -- forcing_eval_era5/conv2icon was cleared and the
# linker's MONTHS is empty. Proven in job 15629863: init_latbc 39.6 -> 79.3 s, no per-step cost, no
# serial fallback (F48). Same expression as the engine default (sim_config.sh:84), latbc -> latbc_zip,
# so every chunk picks its own month. The SST/sea-ice files follow via __latbc_root__ = dirname.
icon_latbc_dir=${frc_dir}/icon/latbc_zip/$(date -u -d "${startdate}" +%Y%m)
fname_iconnml=NAMELIST_icon_pkp006
icon_nml_dir=${nml_dir}/icon_pkp006 # namelists and dictionaries: symlinks into configuration_pg-kics_common/tested (linker script); the nml/icon submodule stays untouched
icon_initmode=2 # MODE_IFSANA: ERA5 (IFS) input
fname_ifs2icon=ifs2icon_R13B07_DOM01.nc
fname_iconini=${frc_dir}/icon/inidata/cas$(date -u -d "${startdate}" +%Y%m%d%H)_ini.nc
fname_icondomain=EUR-3_R13B07_v20260423-00_DOM01.nc
domainfile_icon=EUR-3_R13B07_v20260423-00_DOM01.nc
fname_iconradgrid=EUR-3_R13B07_v20260423-00_DOM01.parent.nc
fname_iconlatbcgrid=EUR-3_R13B07_v20260606-00_DOM01_latbc.grid.nc
fname_iconextpar=EUR-3_R13B07_v20260423-00_DOM01_external_parameter.HWSD2-SOILTYP_9_5.nc
fname_iconghgforc=bc_data/greenhouse_ssp245.nc # SSP2-4.5 as CEI195c, DWD and SPICE; identical to SSP3-7.0 before 2014
fname_iconsplumes=aerosoldata/MACv2.0-SP-merged-historical-and-SSP2-45_v1.nc # overrides the engine default SSP3-70
fname_iconkinne=aerosoldata/europe033_aeropt_kinne # prefix; _lw_b16_coa.nc etc. are appended
icon_kinne_bgyear=1850
fname_iconozone=bc_data/bc_ozone_historical # prefix; _<year>.nc is appended
icon_dtime=30 # [s] from 2002 on: PG KICS decision 2026-09-14 (Q2), was 36 (CEI195c); physics calls at integer multiples, dt_conv 60 s, dt_rad/sso/gwd 120 s
icon_dtime_spinup=25 # [s] spinup month 2001-12 (initialisation shock, CFL); 25 s as DWD, concept.md's 20 s was a mistake (W12)
icon_spinup_end=2002-01-01T00:00Z

[sim_config_clm]
domainfile_clm=domain.lnd.ICON-11_ICON-11.230302_landlake_halo.nc
surffile_clm=surfdata_ICON-11_hist_16pfts_Irrig_CMIP6_simyr2000_c230302_gcvurb-pfsoil_halo.nc
clmoutvar='TWS','H2OSOI','TSOI','TG','EFLX_LH_TOT','FSH','FSA','FSR','FIRA','Rnet','EFLX_SOIL_GRND'

[sim_config_parflow]
pfl_ngx=444
pfl_ngy=432
pfl_mask=PfbMask4SolidFile_eCLM.pfsol
pfloutmfilt=24
pfltsfilerst=$((pfloutmfilt - 1))

[sim_config_oas]
icon_ncg=189976
clm_ngx=189976
clm_ngy=1

###
# POS
###
[pos_config_icon]
# pkp006: SPICE-compatible monthly post files of the four deliverables PMSL, TOT_PREC, T_2M, SP300p
# (ctl/pos_ctl/pos_varlist_icon.csv, tools in ctl/pos_ctl/tools). Paths default to dta/postpro/icon,
# the Zonda rotated grid in dta/geo/icon/static and SPICE's files in dta/geo/icon/spice (linker script).
pos_partial=false # true only for tests with chunks shorter than a month (processes the incomplete month)
pos_out=$(realpath -m ${ctl_dir}/../dta/postpro/${caseid}${modelid}) # pkp007: post files per case, dta/postpro/<case>_icon/<YYYY_MM>, beside pkp006's dta/postpro/icon (CASE_ID ""), which is never touched
pos_ntasks=8 # post_one.sh processes at a time
pos_omp=16 # CDO threads per process
pos_ga_title="PG KICS cycle-2026 initial tests, pkp006: ICON EUR-3 on JURECA-DC with the TSMP2 workflow engine"
pos_ga_institution="FZJ-JSC"
pos_ga_project_id="PG KICS cycle-2026-prep-tests"
pos_ga_contact=k.goergen@fz-juelich.de
pos_ga_icon_version="ICON release-2026.04-public"


